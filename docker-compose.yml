services:
  tally:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: tally:latest
    user: "${UID:-1000}:${GID:-1000}"
    container_name: tally
    restart: unless-stopped
    ports:
      - "${TALLY_PORT:-3000}:3000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN required}
      SITES: ${SITES:-}
      RUST_LOG: ${RUST_LOG:-info,tally=info}
      PORT: "3000"
      DB_PATH: /data/tally.db
    volumes:
      - ./data:/data
